<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>
    <h4>Botones de Aumento y Disminución</h4>
    <input type="button" value="Aumentar" onclick="incrementar()">
    <!-- El atributo "ONCLICK" llama a la funcion "INCREMENTAR" definida en el archivo JavaScript" -->

    <input type="button" value="Disminuir" onclick="decrementar()">
    <!-- El atributo "ONCLICK" llama a la funcion "DECREMENTAR" definida en el archivo JavaScript" -->
    <script src="contador.js"></script>
</body>
</html>
